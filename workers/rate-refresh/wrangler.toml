name = "info-jp-rate-refresh"
main = "src/index.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

# Refresh mid-market rates every 10 minutes (matches RATE_TTL_SECONDS).
[triggers]
crons = ["*/10 * * * *"]

# Must be the SAME namespace the Pages app reads from.
# Paste the prod id you created with `wrangler kv namespace create RATES_KV`.
[[kv_namespaces]]
binding = "RATES_KV"
id = "REPLACE_WITH_PROD_KV_ID"
